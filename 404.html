<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Page Not Found — Deva Graphic Design</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #202022;
      --card-bg: #FFFFFF;
      --accent-color: #FFB914;
      --text-dark: #333333;
      --text-light: #E0E0E0;
      --border-dark: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px),
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
      color: var(--text-light);
      font-family: 'Fredoka', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      background: var(--card-bg);
      border: 3px solid var(--border-dark);
      border-radius: 28px;
      padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
      box-shadow: 10px 10px 0 var(--accent-color), 10px 10px 0 3px var(--border-dark);
      max-width: 580px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-block;
      font-family: 'Space Mono', Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #17118B;
      background: rgba(23, 17, 139, 0.1);
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    .error-code {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: clamp(4.5rem, 12vw, 7rem);
      line-height: 0.95;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
      text-shadow: 4px 4px 0 var(--accent-color);
    }
    .error-title {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: clamp(1.4rem, 3.5vw, 1.85rem);
      color: var(--text-dark);
      margin-bottom: 0.85rem;
    }
    .error-desc {
      color: #666666;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--accent-color);
      color: var(--text-dark);
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 0.85rem 1.75rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 3px 3px 0 var(--border-dark);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .return-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--border-dark);
    }
  </style>
</head>
<body>
  <main class="error-card">
    <span class="badge">ERROR // 404</span>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The visual you are looking for does not exist or has moved. Let's get you back to the work.</p>
    <a href="https://www.devs-portfolio.online/" class="return-btn">
      <span>Return to Home</span>
      <span aria-hidden="true">&rarr;</span>
    </a>
  </main>
</body>
</html>
